syntax = "proto3";
package ET;

// ResponseType G2C_ClaimTask
message C2G_ClaimTask // ISessionRequest
{
	int32 RpcId = 1;
	int32 TaskId = 2;
}

message G2C_ClaimTask // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated SlotGrantProto Wallet = 4;
}

